tutorial: false

run:
  name: "dk-baseline"
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: overnight
planning_horizons: 2030

countries: ["DK"]

snapshots:
  start: "2013-06-01"
  end: "2013-07-01"

electricity:
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, nuclear]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 pipeline]

  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]

atlite:
  default_cutout: europe-2013-sarah3-era5
  cutouts:
    europe-2013-sarah3-era5:
      module: era5
      x: [7.5, 15.5]
      y: [54.0, 58.5]
      time: ["2013-06-01", "2013-07-01"]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  temporal:
    averaging: false
  cluster_network:
    n_clusters: 5

sector:
  enabled: true #enable sector-coupling
  transport: true
  gas_network: true
  H2_retrofit: true

  # --- TRANSPORT / EV SETTINGS ---
  # These parameters define the EV fleet, battery capacity, smart charging, and V2G:
  bev_dsm: true
  bev_dsm_availability: 0.5            # 50% of the fleet participates in DSM
  bev_dsm_restriction_value: 0.8       # Must reach 80% SoC by restriction time
  bev_dsm_restriction_time: 7          # 07:00 in the morning
  bev_energy: 0.05                     # 0.05 MWh = 50 kWh battery capacity per vehicle
  bev_charge_rate: 0.011               # 0.011 MW = 11 kW charger power rating
  bev_charge_efficiency: 0.9           # 90% charging efficiency
  bev_avail_max: 0.95                  # Maximum fleet connection availability factor
  bev_avail_mean: 0.8                  # Average fleet connection availability factor
  v2g: true                            # Enables Vehicle-to-Grid discharge back to the grid

  # Fleet adoption rates for the 2030 planning horizon
  land_transport_electric_share:
    2030: 0.20                         # Change to 1.0 later if modeling a fully electrified fleet
  land_transport_ice_share:
    2030: 0.80                         # Internal combustion engine share
  land_transport_fuel_cell_share:
    2030: 0.0                          # Hydrogen fuel cell share

  # Vehicle consumption parameters
  transport_electric_efficiency: 53.19 # km/MWh (~18.8 kWh/100 km)
  EV_lower_degree_factor: 0.98         # Cabin heating sensitivity
  EV_upper_degree_factor: 0.63         # Cabin cooling sensitivity

  residential_heat:
    dsm:
      enable: true
      direction:
      - overheat
      restriction_value:
        2020: 0.06
        2025: 0.16
        2030: 0.27
      restriction_time:
      - 10
      - 21
  district_heating:
    ptes:
      supplemental_heating:
        enable: true
        booster_heat_pump: true
    ates:
      enable: true
  heat_pump_sources:
    urban central:
    - air
    - geothermal
    - river_water
    urban decentral:
    - air
    rural:
    - air
    - ground
  hydrogen_turbine: false
  regional_oil_demand: false
  regional_co2_sequestration_potential:
    enable: false
  co2_spatial: false
  co2_network: false
  methanol:
    methanol_to_power:
      ocgt: false
    biomass_to_methanol: false
  ammonia: false
  biomass_spatial: false
  biomass_to_liquid: false
  electrobiofuels: false

industry:
  HVC_environment_sequestration_fraction: 0.5
  waste_to_energy: true
  waste_to_energy_cc: true

solving:
  solver:
    name: highs
    options: highs-default
  mem_mb: 8000

  check_objective:
    enable: false

plotting:
  map:
    boundaries:
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: auto
  costs_threshold: 0.001
  energy_max: auto
  energy_min: auto
  energy_threshold: 0.00001
  interactive_bus_balance:
    bus_name_pattern: "*central heat*"
  enable_heat_source_maps: true

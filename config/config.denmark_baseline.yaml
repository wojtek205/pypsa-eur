tutorial: true

run:
  name: "dk-baseline"
  disable_progressbar: true
  shared_resources:
    policy: false

foresight: overnight
planning_horizons: 2030

countries: ["DK"]

snapshots:
  start: "2013-06-01"
  end: "2013-07-01"

electricity:
  extendable_carriers:
    Generator: [solar, onwind, OCGT, CCGT, nuclear]
    StorageUnit: [battery]
    Store: [H2]
    Link: [H2 pipeline]

  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]

atlite:
  default_cutout: europe-2013-sarah3-era5
  cutouts:
    be-03-2013-era5:
      module: era5
      x: [4., 15.]
      y: [46., 56.]
      time: ["2013-03-01", "2013-03-08"]

renewable:
  offwind-ac:
    max_depth: false
  offwind-dc:
    max_depth: false
  offwind-float:
    max_depth: false
    min_depth: false

clustering:
  temporal:
    averaging: false
  cluster_network:
    n_clusters: 2

sector:
  enabled: true #enable sector-coupling
  # --- TRANSPORT / EV SETTINGS ---
  # These parameters define the EV fleet, battery capacity, smart charging, and V2G:
  bev_dsm: true                    # Enables smart charging / demand side management
  bev_availability: 0.5            # Fraction of vehicles available for smart charging / plugged in
  bev_energy: 0.05                 # Average battery size in MWh (50 kWh per EV)
  bev_charge_rate: 0.011           # Charger power in MW (11 kW home charger)
  bev_plug_to_wheel_efficiency: 0.2 # MWh/100km or efficiency metric
  v2g: true                        # Enables bidirectional vehicle-to-grid power flow
  v2g_availability: 0.5            # Fraction of parked cars participating in V2G

  gas_network: true
  H2_retrofit: true
  residential_heat:
    dsm:
      enable: true
      direction:
      - overheat
      restriction_value:
        2020: 0.06
        2025: 0.16
        2030: 0.27
      restriction_time:
      - 10
      - 21
  district_heating:
    ptes:
      supplemental_heating:
        enable: true
        booster_heat_pump: true
    ates:
      enable: true
  heat_pump_sources:
    urban central:
    - air
    - geothermal
    - river_water
    - sea_water
    urban decentral:
    - air
    rural:
    - air
    - ground
  hydrogen_turbine: false
  regional_oil_demand: false
  regional_co2_sequestration_potential:
    enable: false
  co2_spatial: false
  co2_network: false
  methanol:
    methanol_to_power:
      ocgt: false
    biomass_to_methanol: false
  ammonia: false
  biomass_spatial: false
  biomass_to_liquid: false
  electrobiofuels: false

industry:
  HVC_environment_sequestration_fraction: 0.5
  waste_to_energy: true
  waste_to_energy_cc: true

solving:
  solver:
    name: highs
    options: highs-default
  mem_mb: 4000

  check_objective:
    enable: true
    expected_value: 568751130.55

plotting:
  map:
    boundaries:
  eu_node_location:
    x: -5.5
    y: 46.
  costs_max: auto
  costs_threshold: 0.001
  energy_max: auto
  energy_min: auto
  energy_threshold: 0.00001
  interactive_bus_balance:
    bus_name_pattern: "*central heat*"
  enable_heat_source_maps: true
